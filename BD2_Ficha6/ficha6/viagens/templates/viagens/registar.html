<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Registar viagem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 m-0">Registar viagem</h1>
      <a class="btn btn-outline-secondary" href="/consultar/">Consultar</a>
    </div>

    {% if mensagem %}
      <div class="alert alert-info">{{ mensagem }}</div>
    {% endif %}

    <form method="post" class="card p-3 shadow-sm">
      {% csrf_token %}

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Origem</label>
          <input class="form-control" name="origem" list="estacoes" placeholder="ex: Porto-Campanhã" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Destino</label>
          <input class="form-control" name="destino" list="estacoes" placeholder="ex: Lisboa - Santa Apolónia" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Data</label>
          <input class="form-control" type="date" name="data">
        </div>
        <div class="col-md-6">
          <label class="form-label">Hora</label>
          <input class="form-control" type="time" name="hora">
        </div>
      </div>

      <hr class="my-4">

      <fieldset>
        <legend class="fs-6 text-muted mb-2">Paragens intermédias (0–4)</legend>
        <div class="row g-2">
          <div class="col-md-3"><input class="form-control" name="paragem1" placeholder="Paragem 1" list="estacoes"></div>
          <div class="col-md-3"><input class="form-control" name="paragem2" placeholder="Paragem 2" list="estacoes"></div>
          <div class="col-md-3"><input class="form-control" name="paragem3" placeholder="Paragem 3" list="estacoes"></div>
          <div class="col-md-3"><input class="form-control" name="paragem4" placeholder="Paragem 4" list="estacoes"></div>
        </div>
        <small class="text-muted">Deixa em branco as que não precisares.</small>
      </fieldset>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-light" href="/consultar/">Ver lista</a>
      </div>
    </form>

    <datalist id="estacoes">
      {% if estacoes %}
        {% for e in estacoes %}<option value="{{ e }}">{% endfor %}
      {% else %}
        <option value="Porto-Campanhã">
        <option value="Porto - São Bento">
        <option value="Aveiro">
        <option value="Coimbra-B">
        <option value="Santarém">
        <option value="Lisboa - Oriente">
        <option value="Lisboa - Santa Apolónia">
        <option value="Entrecampos">
        <option value="Faro">
      {% endif %}
    </datalist>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
