<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Cursos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
  <h1 class="h3 mb-3">Consulta de Cursos</h1>

  <div class="table-responsive">
    <table class="table table-sm table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>Registo</th>
          <th>Denominação</th>
          <th>ECTS</th>
          <th>Estado</th>
          <th>Instituição de ensino superior</th>
        </tr>
      </thead>
      <tbody>
        {% for c in cursos %}
        <tr>
          <td>{{ c.Registo }}</td>
          <td>{{ c.Denominacao }}</td>
          <td>{{ c.ECTS }}</td>
          <td>{{ c.Estado }}</td>
          <td>
            {% for i in c.Instituicoes %}
              {{ i }}{% if not forloop.last %}<br>{% endif %}
            {% endfor %}
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="5" class="text-muted">Sem resultados.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
