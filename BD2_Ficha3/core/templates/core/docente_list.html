{% extends "core/base.html" %}
{% block title %}Docentes{% endblock %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Lista de Docentes</h2>
    <a class="btn btn-primary" href="{% url 'docente_create' %}">Inserir Docente</a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width:80px">ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th style="width:200px">Ações</th>
          </tr>
        </thead>
        <tbody>
          {% for d in docentes %}
            <tr>
              <td class="text-muted">{{ d.id_docente }}</td>
              <td class="fw-semibold">{{ d.nome }}</td>
              <td>{{ d.email }}</td>
              <td>
                <div class="d-flex gap-2">
                  <a class="btn btn-warning btn-sm" href="{% url 'docente_update' d.id_docente %}">Editar</a>
                  <form method="post" action="{% url 'docente_delete' d.id_docente %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-danger btn-sm" type="submit"
                      onclick="return confirm('Eliminar docente {{ d.nome }}?')">Eliminar</button>
                  </form>
                </div>
              </td>
            </tr>
          {% empty %}
            <tr><td colspan="4" class="text-center text-muted py-4">Sem registos.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
