<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>{% block title %}App{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'home' %}">Home</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'docente_list' %}">Docentes</a>
        <a class="nav-link" href="{% url 'inscricao_list' %}">Inscrições</a>
        <a class="nav-link" href="{% url 'docente_top' %}">Top Docente</a>
        <a class="nav-link" href="{% url 'inscricoes_por_ano' %}">Inscrições 2025</a>
      </div>
    </div>
  </nav>

  <main class="container">
    {% if messages %}
      <div class="mb-3">
        {% for m in messages %}
          <div class="alert {% if m.tags == 'success' %}alert-success{% elif m.tags == 'error' %}alert-danger{% else %}alert-info{% endif %} mb-2">
            {{ m }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
